<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <!-- 💡 아래 3줄 코드를 꼭 추가해 주세요! -->
  <link rel="manifest" href="manifest.json?v=1">
  <link rel="icon" href="kyungwoo.png?v=1" type="image/png">
  <link rel="apple-touch-icon" href="kyungwoo.png?v=1">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#05070b">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>성공신화 박희수의 가계부</title>

  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
    :root{
      --bg:#05070b; --card:rgba(255,255,255,.96); --text:#111827; --muted:#6b7280;
      --line:#e5e7eb; --green:#15803d; --red:#dc2626; --dark:#111827; --gold:#c9a227;
    }

    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;}

    /* ======================================================================
       ⭐ 배경화면 : GitHub 에 올린 kyungwoo.png 를 배경으로 사용
       ====================================================================== */
    body{
      padding:12px;min-height:100vh;
      background-image:url("kyungwoo.png");
      background-size:cover;
      background-position:center top;
      background-repeat:no-repeat;
      background-attachment:fixed;
      background-color:#05070b;
    }
    /* ======================================================================
       🎨 Ver 3.0 투명도 조절 가이드 (나중에 혼자 고칠 때 — 여기만 바꾸면 됩니다)
       ======================================================================
       ① 배경 딤(화면 전체를 살짝 덮는 어두운 막) 세기 :
          → 아래 body::before 의 background 에서 마지막 숫자만 조절
            rgba(5,7,11, .12)  ← .12 = 지금 값(거의 안 덮음, 배경 가장 잘 보임)
            .25 = 이전 버전 / .55 = 예전(많이 어둡던) 값 / 0 으로 하면 막 없음

       ② 첫 화면 카드 투명도 :
          → #inputScreen 의 background 에서 마지막 숫자만 조절
            rgba(8,12,20, .22) ← .22 = 지금 값 / .42 = 이전 버전 / 1 = 불투명
          → 카드 뒤를 흐리게 하는 블러 정도 :
            -webkit-backdrop-filter / backdrop-filter 의 blur(12px) 숫자
            (숫자가 클수록 카드 뒤 배경이 더 흐려짐, 0 이면 블러 없음)

       ③ 수입/지출 버튼 배경 투명도 :
          → .mode-btn 의 background rgba(255,255,255, .06)

       ④ "가계부 정보 입력하기" 버튼 배경 투명도 :
          → .primary 의 background:linear-gradient(100deg,
            rgba(231,198,95,.9), rgba(201,162,39,.85))
            에서 각 rgba 의 마지막 숫자(불투명도). 1 이면 완전 불투명.
       ====================================================================== */
    body::before{
      content:"";position:fixed;inset:0;background:rgba(5,7,11,.12);
      z-index:0;pointer-events:none;
    }

    /* ⭐ 수정 ② : 첫 화면 세로 정중앙 정렬 (flex + min-height)
       - 보이는 .card.screen 이 margin:auto 로 남은 세로 공간을 균등 분배 → 정중앙
       - 내용이 화면보다 길면(STEP 2 폼) auto margin 이 0 이 되어
         상단이 잘리지 않고 위부터 정상 출력됨 */
    .wrap{max-width:520px;margin:0 auto;position:relative;z-index:1;
      min-height:calc(100vh - 24px);display:flex;flex-direction:column;}

    /* ⭐ 수정 ② : 세로 중앙 정렬용 */
    .card.screen{margin:auto 0;width:100%;}

    /* ======================================================================
       ⭐ STEP 2 상단 고정형 버튼 3개 (원본 X Notion 과 100% 동일 구성)
       ====================================================================== */
    .top-fixed-bar{
      position:fixed;top:0;left:0;right:0;z-index:50;
      display:flex;gap:6px;justify-content:center;
      padding:8px 10px;
      background:rgba(5,7,11,.9);
      backdrop-filter:blur(8px);
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .top-fixed-bar button{
      flex:1 1 0;max-width:170px;
      border:1px solid rgba(255,255,255,.18);
      border-radius:10px;background:rgba(255,255,255,.08);
      color:#fff;font-size:12.5px;font-weight:800;
      padding:9px 4px;cursor:pointer;white-space:nowrap;
    }
    .top-fixed-bar button:active{background:rgba(255,255,255,.2);}
    .top-fixed-bar button:disabled{opacity:.5;}

    /* ⭐ 수정 ② : 기본 높이 0 (첫 화면은 중앙 정렬)
       STEP 2 진입 시 JS 가 52px 로 올려서 고정바 밑으로 내용이 안 가려지게 함 */
    .top-spacer{height:0;flex:0 0 auto;}

    .card{background:var(--card);border-radius:16px;padding:18px 18px 14px;margin-bottom:0;
      box-shadow:0 10px 30px rgba(0,0,0,.35);}   /* ⭐ Ver 3.0 : 카드 하단 여백/간격 축소 */
    .screen{display:block;}
    .step-hidden{display:none!important;}

    .brand{text-align:center;margin:2px 0 10px;}   /* ⭐ Ver 3.0 : 위아래 여백 축소 */
    .brand .brand-title{font-size:19px;font-weight:800;letter-spacing:-.4px;color:#fff;}
    .brand .brand-sub{font-size:12px;color:#9ca3af;margin-top:4px;}
    .fenomeno-status{font-size:11px;letter-spacing:2px;color:var(--gold);font-weight:700;}

    h2.section{font-size:15px;margin:0 0 12px;font-weight:800;color:var(--dark);}

    /* ======================================================================
       ⭐ 수정 ① NEW : STEP 1 (첫 화면) 유리 카드
          - 흰색 불투명 카드(.96) 대신 반투명 다크글래스 + blur 로 변경
          - kyungwoo.png 배경이 카드에 비치면서도, 글자는 그림자로 가독성 확보
       ====================================================================== */
    #inputScreen{
      background:rgba(8,12,20,.22);   /* ← 카드 투명도 : 이 숫자만 바꾸면 됨 */
      -webkit-backdrop-filter:blur(12px) saturate(1.2);
      backdrop-filter:blur(12px) saturate(1.2);
      border:1px solid rgba(255,255,255,.35);
      box-shadow:0 18px 44px rgba(0,0,0,.45);
      color:#f9fafb;
      padding-bottom:12px;   /* ⭐ Ver 3.0 : 카드 아래쪽 여백 최소화 */
    }
    /* 골드 그라데이션 타이틀 (흰색 대신 고급스러운 색감) */
    #inputScreen .brand-title{
      font-size:22px;font-weight:900;letter-spacing:-.5px;
      background:linear-gradient(100deg,#f9ecc0 0%,#e7c65f 45%,#c9a227 100%);
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;color:transparent;
      filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));
    }
    #inputScreen .brand-sub{
      color:rgba(255,255,255,.85);
      text-shadow:0 1px 4px rgba(0,0,0,.65);
      letter-spacing:.2px;
    }
    #inputScreen h2.section{
      color:rgba(255,255,255,.92);
      text-shadow:0 1px 4px rgba(0,0,0,.6);
    }
    /* ⭐ Ver 3.0 : 첫 화면 카드 아래 불필요한 공간 제거
       (구분선을 아예 숨김 — 카드가 "입력하기" 버튼에서 바로 끝나서
        배경 이미지가 넓게 보입니다) */
    #inputScreen .divider{display:none;}
    #inputScreen .row-note{
      color:rgba(255,255,255,.88);
      text-shadow:0 1px 3px rgba(0,0,0,.55);
    }

    /* STEP 1 */
    .mode-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
    /* ⭐ 수정 ③ : 수입/지출 버튼
       - "가계부 정보 입력하기" 버튼과 동일한 높이 규격 (padding 16px · font-size 16px)
       - 아이콘을 옆으로 붙여 한 줄 배치 → 버튼 높이를 입력하기 버튼과 똑같이
       - 반투명 글래스 + 흰 테두리로 배경 이미지가 비치게 하되 글자는 그림자로 확실히 보임
       - (만약 수입/지출을 입력하기 버튼처럼 세로로 쌓고 싶으면
          아래 grid-template-columns 를 "1fr" 로만 바꾸면 됨) */
    .mode-btn{
      border:2px solid rgba(255,255,255,.5);
      background:rgba(255,255,255,.06);   /* ⭐ Ver 3.0 : 버튼도 더 투명하게 */
      -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
      border-radius:14px;padding:16px 8px;
      font-size:16px;font-weight:800;color:#fff;cursor:pointer;transition:.15s;
      text-shadow:0 1px 4px rgba(0,0,0,.55);
    }
    .mode-btn .mode-icon{display:inline;font-size:17px;margin-right:6px;}
    .mode-btn.active[data-mode="지출"]{background:rgba(220,38,38,.32);border-color:#fca5a5;color:#fff;}
    .mode-btn.active[data-mode="수입"]{background:rgba(21,128,61,.35);border-color:#86efac;color:#fff;}

    button{font-family:inherit;}
    /* ⭐ 수정 ① : "가계부 정보 입력하기" 버튼 — 골드 그라데이션으로 시선 강화 */
    .primary{
      width:100%;border:1px solid rgba(255,255,255,.55);border-radius:14px;
      background:linear-gradient(100deg,rgba(231,198,95,.9),rgba(201,162,39,.85));color:#191203;
      padding:16px;font-size:16px;font-weight:900;letter-spacing:-.2px;cursor:pointer;
      box-shadow:0 10px 26px rgba(0,0,0,.4);
    }
    .primary:disabled{opacity:.5;}

    /* ⭐ 상태바 + 목록 새로고침 한 줄 배치 (원본과 동일) */
    .step2-status-row{display:flex;gap:8px;align-items:stretch;margin-bottom:14px;}
    .status-bar{flex:1 1 auto;border-radius:12px;padding:11px 13px;font-size:13px;font-weight:700;
      display:flex;align-items:center;gap:8px;line-height:1.35;min-height:46px;}
    .status-bar.loading{background:#fffbeb;color:#92400e;border:1px solid #fde68a;}
    .status-bar.ready{background:#f0fdf4;color:var(--green);border:1px solid #bbf7d0;}
    .status-bar.error{background:#fef2f2;color:var(--red);border:1px solid #fecaca;}
    .status-bar .spinner{width:13px;height:13px;border:2px solid rgba(0,0,0,.18);
      border-top-color:currentColor;border-radius:50%;animation:spin .8s linear infinite;flex:0 0 auto;}
    .status-bar.ready .spinner,.status-bar.error .spinner{display:none;}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ⭐ 녹색 상태바 오른쪽 옆 목록 새로고침 (작은 크기) */
    .master-refresh-btn{flex:0 0 auto;border:1px solid var(--line);border-radius:12px;background:#fff;
      color:var(--dark);font-size:11.5px;font-weight:800;padding:0 10px;min-height:46px;
      cursor:pointer;white-space:nowrap;line-height:1.2;}
    .master-refresh-btn:disabled{opacity:.55;}

    label.field{display:block;font-size:13px;font-weight:800;color:var(--dark);margin:16px 0 7px;}
    label.field .req{color:var(--red);margin-left:2px;}
    input[type="text"],input[type="number"],input[type="date"],select{
      width:100%;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:16px;
      color:var(--text);background:#fff;font-family:inherit;outline:none;}
    input:focus,select:focus{border-color:var(--dark);}
    input[type="date"]{-webkit-appearance:none;appearance:none;}
    input[inputmode="numeric"]{text-align:right;font-weight:800;letter-spacing:.5px;}

    .amount-row{display:flex;gap:8px;align-items:stretch;}
    .amount-row input{flex:1;}
    .mic-btn{flex:0 0 54px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:20px;
      cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .mic-btn.rec{background:#fef2f2;border-color:var(--red);animation:pulse 1s infinite;}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
    .mic-hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;}

    .button-group{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}
    .button-group button{border:none;border-radius:14px;padding:16px;font-size:15px;font-weight:800;cursor:pointer;}
    .btn-confirm{background:var(--dark);color:#fff;}
    .btn-back{background:#f3f4f6;color:var(--dark);}
    .btn-confirm:disabled{opacity:.5;}

    .listening{background:#f0fdf4;color:var(--green);border:1px solid #bbf7d0;border-radius:12px;
      padding:14px;font-size:14px;font-weight:700;text-align:center;line-height:1.6;}
    .error{background:#fef2f2;color:var(--red);border:1px solid #fecaca;border-radius:12px;
      padding:14px;font-size:14px;font-weight:700;line-height:1.6;word-break:break-all;}
    .ok{background:#f0fdf4;color:var(--green);border:1px solid #bbf7d0;border-radius:12px;
      padding:14px;font-size:14px;font-weight:700;line-height:1.7;}
    .ok a{color:var(--green);}
    .row-note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.55;}
    .divider{height:1px;background:var(--line);margin:18px 0;}
    .amount-display{font-size:13px;color:var(--green);font-weight:800;margin-top:6px;}

    /* ======================================================================
       ⭐ Ver 3.0 STEP 3 : 등록 상태 팝업 카드
          - 배경 이미지가 최대한 보이도록 반투명 글래스 처리
          - 화면 상단에 작고 컴팩트하게 배치
          - 투명도를 바꾸고 싶으면 .step3-card 의 background rgba 마지막 숫자만 조절
            (.35 = 지금 값, 작을수록 더 투명)
       ====================================================================== */
    .step3-card{
      background:rgba(8,12,20,.35);
      -webkit-backdrop-filter:blur(10px) saturate(1.2);
      backdrop-filter:blur(10px) saturate(1.2);
      border:1px solid rgba(255,255,255,.3);
      box-shadow:0 18px 44px rgba(0,0,0,.45);
      color:#f9fafb;
    }
    .card.screen.step3-card{max-width:340px;margin:8px auto 0;padding:18px 16px 16px;}
    .step3-title{
      font-size:17px;font-weight:900;letter-spacing:-.3px;
      text-align:center;margin:0 0 12px;
      text-shadow:0 2px 6px rgba(0,0,0,.6);
    }
    .step3-card .ok,.step3-card .error,.step3-card .listening{
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.18);
      color:#f9fafb;
      text-shadow:0 1px 3px rgba(0,0,0,.5);
      text-align:left;
    }
    .step3-card .ok a{color:#f9ecc0;}
    .step3-card .listening{color:#f9ecc0;text-align:center;}
    .step3-new-btn{margin-top:12px;}
  </style>
</head>

<body>

<!-- ========================================================================
     ⭐ STEP 2 상단 고정 버튼 3개 (← 메인 화면 / 🔄 새로 고침 / 📖 노션 열기)
     ======================================================================== -->
<div id="topFixedBar" class="top-fixed-bar" style="display:none;">
  <button id="fbMainButton" type="button">← 메인 화면</button>
  <button id="fbRefreshButton" type="button">🔄 새로 고침</button>
  <button id="fbNotionButton" type="button">📖 노션 열기</button>
</div>

<div class="wrap">

  <div class="top-spacer" id="topSpacer"></div>

  <!-- ======================================================================
       STEP 1 : 수입 / 지출 선택
       ====================================================================== -->
  <div id="inputScreen" class="card screen">

    <div class="brand">
      <div class="brand-title">성공신화 박희수의 가계부</div>
      <div class="brand-sub">🎤 음성 · 키보드로 빠르게 기록하기</div>
    </div>

    <h2 class="section">1. 수입 / 지출 선택</h2>

    <div class="mode-row">
      <button type="button" class="mode-btn" data-mode="수입">
        <span class="mode-icon">💰</span>수입
      </button>
      <button type="button" class="mode-btn active" data-mode="지출">
        <span class="mode-icon">💸</span>지출
      </button>
    </div>

    <button id="startInputButton" class="primary">📝 가계부 정보 입력하기</button>

    <div class="divider"></div>

    <div id="result" class="row-note"></div>

  </div>


  <!-- ======================================================================
       STEP 2 : 가계부 정보 입력
       ====================================================================== -->
  <div id="resultCard" class="card screen step-hidden">

    <!-- ⭐ 녹색 상태바 + 오른쪽 목록 새로고침 -->
    <div class="step2-status-row">
      <div id="step2StatusBar" class="status-bar loading">
        <div class="spinner"></div>
        <span id="step2StatusText">월별가계부 · 소분류 · 지출형태를 준비하는 중...</span>
      </div>
      <button id="masterRefreshButton" class="master-refresh-btn" type="button">🗂️ 목록 새로고침</button>
    </div>
    <div class="row-note" id="masterRefreshNote"></div>

    <h2 class="section" id="step2Title">2. 가계부 정보 입력</h2>

    <!-- 금액 -->
    <label class="field" for="amountInput">금액<span class="req">*</span></label>
    <div class="amount-row">
      <input id="amountInput" type="text" inputmode="numeric" placeholder="예) 6,000" autocomplete="off">
      <button id="amountMicButton" class="mic-btn" type="button" title="금액 음성입력">🎤</button>
    </div>
    <div class="amount-display" id="amountDisplay"></div>
    <div class="mic-hint" id="micHint">
      🎤 를 누르고 "육천원" 처럼 금액을 말해보세요.
    </div>

    <!-- 내용 -->
    <label class="field" for="contentInput">수입 / 지출 내용<span class="req">*</span></label>
    <input id="contentInput" type="text" placeholder="예) 아이들 간식 구매" autocomplete="off">

    <!-- 날짜 -->
    <label class="field" for="dateInput">날짜</label>
    <input id="dateInput" type="date">

    <!-- 지출형태 (Default = 카드) -->
    <label class="field" for="spendingTypeSelect">지출형태</label>
    <select id="spendingTypeSelect"></select>

    <!-- 월별가계부 (관계형_월별가계부 DB) -->
    <label class="field" for="monthlySelect">월별가계부</label>
    <select id="monthlySelect"></select>
    <div class="row-note" id="monthlyNote">
      선택한 날짜를 기준으로 해당 월("YYYYMM")을 자동으로 골라줘요.
    </div>

    <!-- 소분류 -->
    <label class="field" for="categorySelect">소분류</label>
    <select id="categorySelect"></select>

    <div class="button-group">
      <button id="backButton" class="btn-back" type="button">◀ 처음으로</button>
      <button id="confirmButton" class="btn-confirm" type="button">✅ 가계부 등록</button>
    </div>

    <div id="step2Result" style="margin-top:14px;"></div>

  </div>

  <!-- ======================================================================
       ⭐ Ver 3.0 STEP 3 : 등록 상태 팝업 (배경 위 반투명 컴팩트 카드)
       ====================================================================== -->
  <div id="step3Screen" class="card screen step-hidden step3-card">

    <div id="step3Title" class="step3-title">📝 노션에 등록 중...</div>
    <div id="step3Body"></div>

  </div>

</div>


<script>
// ============================================================================
// ⭐ 1. GAS 주소
// ============================================================================

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbwkpTXrgO9eRvZGXtwbizlSL-3tXxp2XbudLA3c0ZZdR7SdXg7Kxm9xE6m7Xwz2qDt9/exec";

// ============================================================================
// ⭐ 4. 공통 유틸
// ============================================================================

function $(id) { return document.getElementById(id); }

function escapeHtml(text) {
  return String(text === null || text === undefined ? "" : text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function todayString() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

// 날짜(YYYY-MM-DD) → "YYYYMM"
function toMonthlyKey(dateStr) {
  const parts = String(dateStr || todayString()).split("-");
  return (parts[0] || "") + (parts[1] || "");
}

// 숫자 → "6,000" 형태 (콤마)
function formatAmount(num) {
  if (!num && num !== 0) return "";
  return Number(num).toLocaleString("ko-KR");
}

// "6,000" / "6,000원" → 6000 (콤마 제거한 순수 숫자)
function parseAmountInput(value) {
  const digits = String(value || "").replace(/[^0-9]/g, "");
  return digits ? Number(digits) : 0;
}


// ============================================================================
// 📡 5. GAS POST 공통 (원본 postToGAS 와 100% 동일한 구조)
// ============================================================================

async function postToGAS(payload) {

  if (GAS_DOWN_UNTIL > 0 && Date.now() < GAS_DOWN_UNTIL) {
    throw new Error(
      "GAS 서버가 잠시 응답하지 않아요. 1분 뒤 자동으로 다시 시도돼요. (잠시 후 다시 눌러주세요.)"
    );
  }

  const maxAttempts = 3;
  let lastError = null;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {

    try {

      const response = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      const raw = await response.text();
      console.log("GAS 응답:", raw);

      let data;
      try {
        data = JSON.parse(raw);
      } catch (jsonError) {
        throw new Error("GAS 응답을 읽지 못했습니다.\n\n" + raw);
      }

      GAS_DOWN_UNTIL = 0;
      return data;

    } catch (error) {

      lastError = error;
      console.warn("GAS 요청 " + attempt + "번째 시도 실패:", error);

      if (attempt >= maxAttempts) {
        GAS_DOWN_UNTIL = Date.now() + 60000;
        throw lastError;
      }

      await new Promise(function (resolve) {
        setTimeout(resolve, attempt * 2000);
      });

    }

  }

  throw lastError;

}


// ============================================================================
// 💾 6. STEP 2 목록 캐시 (localStorage)
// ============================================================================

function readOptionsCache() {
  try {
    const raw = localStorage.getItem(OPTIONS_CACHE_KEY);
    if (!raw) return null;
    const saved = JSON.parse(raw);
    if (!saved || !Array.isArray(saved.spendingTypes)) return null;
    if (Date.now() - Number(saved.savedAt || 0) > OPTIONS_CACHE_MAX_AGE) return null;
    return saved;
  } catch (error) {
    return null;
  }
}

function writeOptionsCache(data) {
  try {
    localStorage.setItem(OPTIONS_CACHE_KEY, JSON.stringify({
      savedAt: Date.now(),
      spendingTypes: data.spendingTypes || [],
      categories: data.categories || [],
      monthlyList: data.monthlyList || []
    }));
  } catch (error) {
    console.log("목록 캐시 저장 생략:", error);
  }
}

function fillSelect(selectEl, items, placeholder) {
  selectEl.innerHTML = "";
  const opt0 = document.createElement("option");
  opt0.value = "";
  opt0.textContent = placeholder;
  selectEl.appendChild(opt0);

  items.forEach(function (item) {
    const opt = document.createElement("option");
    opt.value = item.id || item;
    opt.textContent = item.name || item;
    selectEl.appendChild(opt);
  });
}

// ⭐ 지출형태 기본값 "카드" 자동 선택
function selectDefaultSpendingType() {
  const sel = $("spendingTypeSelect");
  if (!sel) return;

  const exact = spendingTypeList.find(function (name) {
    return String(name) === DEFAULT_SPENDING_TYPE;
  });

  if (exact) {
    sel.value = extraSelectValueFind(sel, DEFAULT_SPENDING_TYPE);
    return;
  }

  const partial = spendingTypeList.find(function (name) {
    return String(name).indexOf("카드") >= 0;
  });

  if (partial) {
    sel.value = extraSelectValueFind(sel, partial);
  }
}

function extraSelectValueFind(selectEl, name) {
  for (let i = 0; i < selectEl.options.length; i++) {
    if (selectEl.options[i].textContent === String(name)) {
      return selectEl.options[i].value;
    }
  }
  return "";
}

// ⭐ 월별가계부 : 오늘(또는 선택 날짜) 기준으로 자동 선택
function autoSelectMonthly(dateStr) {
  const sel = $("monthlySelect");
  if (!sel || !monthlyList.length) return;

  const key = toMonthlyKey(dateStr);

  const found = monthlyList.find(function (item) {
    return String(item.name) === key;
  });

  if (found) {
    sel.value = found.id;
    $("monthlyNote").innerHTML =
      '✅ <b>' + escapeHtml(key) + '</b> 월이 자동 선택되었어요.';
  } else {
    sel.value = "";
    $("monthlyNote").innerHTML =
      '⚠️ 월별가계부 DB에 <b>' + escapeHtml(key) +
      '</b> 페이지가 없어요. 목록에서 직접 선택하거나 노션에 먼저 만들어주세요.';
  }
}

function applyOptions(data) {

  spendingTypeList = Array.isArray(data.spendingTypes) ? data.spendingTypes.slice() : [];
  categoryList = Array.isArray(data.categories) ? data.categories.slice() : [];
  monthlyList = Array.isArray(data.monthlyList) ? data.monthlyList.slice() : [];

  fillSelect($("spendingTypeSelect"), spendingTypeList, "선택하세요");
  fillSelect($("monthlySelect"), monthlyList, "선택하세요");
  fillSelect($("categorySelect"), categoryList, "선택하세요");

  selectDefaultSpendingType();
  autoSelectMonthly($("dateInput").value || todayString());

  previewLoaded = true;
}

// 📋 9. STEP 2 목록 로딩 (캐시 우선 → GAS → 캐시 저장)
// ============================================================================

async function loadPreviewOptions() {

  setStatusBar("loading", "월별가계부 · 소분류 · 지출형태를 준비하는 중...");

  const cached = readOptionsCache();
  if (cached) {
    applyOptions(cached);
  }

  try {

    const data = await postToGAS({ action: "preview" });

    if (data.status !== "success") {
      throw new Error(data.message || "목록을 가져오지 못했습니다.");
    }

    applyOptions(data);
    writeOptionsCache(data);

    setStatusBar("ready", "박희수님 정보 입력 가능!");
    $("step2Result").innerHTML = "";   // ⭐ Ver 3.0 : 목록 로딩 성공 시 이전 오류 메시지 정리

    return data;

  } catch (error) {

    console.error("STEP 2 목록 오류:", error);

    if (previewLoaded) {
      setStatusBar("ready", "저장된 목록으로 입력 가능!");
    } else {
      setStatusBar("error", "목록을 가져오지 못했습니다. 잠시 후 다시 시도해주세요.");
      $("step2Result").innerHTML =
        '<div class="error">❌ ' + escapeHtml(error.message || String(error)) + '</div>';
    }

    return null;

  }

}

// 🎤 11. 금액 음성인식 (한국어 숫자 → 숫자 변환)
// ============================================================================

// "육천원" / "6천원" / "1만2천원" / "이만 오천원" → 25000
// ⭐ Ver 3.0 수정 : 한글 숫자와 아라비아 숫자가 섞여도(예: "이만 5000원")
//    만/천/백/십 자리값을 한 글자씩 순서대로 계산해서 항상 올바른 금액이 나오도록
//    파서를 통합·재작성했습니다.
//    (기존에는 숫자가 먼저 매칭되면 앞의 "이만" 을 무시하고 5000 만 반환하는
//     오류가 있었어요 → "이만 오천원", "이만 5000원" 모두 25000 으로 수정)
function koreanAmountToNumber(text) {

  let s = String(text || "")
    .replace(/\s+/g, "")
    .replace(/원|₩|\$|,/g, "");

  const kor = { "영":0,"공":0,"일":1,"이":2,"삼":3,"사":4,"오":5,"육":6,"칠":7,"팔":8,"구":9 };
  const big = { "십":10, "백":100, "천":1000, "만":10000 };

  let total = 0;      // "만" 이 확정된 큰 자릿수 누적 (예: 이만 → 20000)
  let section = 0;    // 현재 만 구간 안에서의 누적 (천/백/십)
  let current = null; // 아직 단위가 붙지 않은 pending 숫자 (한글·아라비아 공통)
  let numBuf = "";    // 아라비아 숫자 버퍼
  let found = false;

  // 아라비아 숫자 버퍼를 pending 숫자로 확정
  function flushDigits() {
    if (numBuf !== "") {
      current = (current === null ? 0 : current) + Number(numBuf);
      numBuf = "";
      found = true;
    }
  }

  // pending 숫자를 현재 만 구간에 더함
  function settleCurrent() {
    if (current !== null) {
      section += current;
      current = null;
    }
  }

  for (let i = 0; i < s.length; i++) {

    const ch = s[i];

    if (ch >= "0" && ch <= "9") {
      numBuf += ch;
      continue;
    }

    flushDigits();

    if (kor[ch] !== undefined) {
      // 한글 숫자 (이/오/육 ...) — pending 숫자로 쌓음
      current = (current === null ? 0 : current) * 10 + kor[ch];
      found = true;

    } else if (big[ch] !== undefined) {
      // 단위 (십/백/천/만)
      found = true;
      const unit = big[ch];

      if (unit === 10000) {
        // "만" 이 오면 지금까지의 값(천/백/십 포함)을 만 단위로 확정
        const madeSection = section + (current === null ? 0 : current);
        total += (madeSection === 0 ? 1 : madeSection) * 10000;
        section = 0;
        current = null;
      } else {
        section += (current === null ? 1 : current) * unit;
        current = null;
      }

    } else {
      // 그 외 문자 — pending 숫자 확정
      settleCurrent();
    }

  }

  flushDigits();
  settleCurrent();

  const result = total + section;

  if (found && result > 0) return Math.round(result);

  const digits = s.replace(/[^0-9]/g, "");
  return digits ? Number(digits) : 0;

}

// ⭐ 금액 입력칸에 콤마를 찍어서 보여줌
function refreshAmountDisplay() {

  const raw = parseAmountInput($("amountInput").value);

  if (raw > 0) {

}

function startAmountRecognition() {

  if (!SpeechRecognition) {
    $("micHint").innerHTML =
      '<span style="color:#dc2626">❌ 이 브라우저는 음성인식을 지원하지 않아요. ' +
      '금액은 키보드로 직접 입력해주세요.</span>';
    $("amountInput").focus();
    return;
  }

  if (isRecording) return;

  recognition = new SpeechRecognition();
  recognition.lang = "ko-KR";
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.maxAlternatives = 1;

  let finalText = "";

  recognition.onstart = function () {
    isRecording = true;
    $("amountMicButton").classList.add("rec");
    $("step2Result").innerHTML = "";   // ⭐ Ver 3.0 : 녹음 시작 전 이전 상태 메시지 먼저 정리
    $("micHint").innerHTML = "🎤 듣고 있어요... 금액을 말해주세요.";
  };

  recognition.onresult = function (event) {
    let interim = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const t = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalText += t;
      else interim += t;
    }
    const shown = finalText || interim;
    $("micHint").innerHTML = "🎤 인식중: <b>" + escapeHtml(shown) + "</b>";
  };

  recognition.onerror = function (event) {
    isRecording = false;
    $("amountMicButton").classList.remove("rec");
    $("micHint").innerHTML =
      '<span style="color:#dc2626">❌ 음성인식 오류(' +
      escapeHtml(event.error || "") +
      '). 금액은 직접 입력해주세요.</span>';
  };

  recognition.onend = function () {
    isRecording = false;
    $("amountMicButton").classList.remove("rec");

    const amount = koreanAmountToNumber(finalText);

    if (amount > 0) {
      $("amountInput").value = formatAmount(amount);
      $("amountDisplay").textContent = "→ " + formatAmount(amount) + "원";
      $("micHint").innerHTML =
        '✅ 인식 결과: <b>' + escapeHtml(finalText.trim()) +
        '</b> → ' + formatAmount(amount) + '원';
    } else if (finalText.trim()) {
      $("micHint").innerHTML =
        '<span style="color:#dc2626">금액을 알아듣지 못했어요("' +
        escapeHtml(finalText.trim()) +
        '"). 숫자로 직접 입력해주세요.</span>';
      $("amountInput").focus();
    } else {
      $("micHint").innerHTML = "🎤 를 누르고 금액을 말해보세요.";
    }

  };

  try {
    recognition.start();
  } catch (error) {
    isRecording = false;
    $("amountMicButton").classList.remove("rec");
    console.error(error);
  }

}

  const newBtn = $("step3NewButton");
  if (newBtn) {
    newBtn.addEventListener("click", startNewLedgerFromStep3);
  }
  window.scrollTo(0, 0);
}

// ⭐ Ver 3.0 : STEP 3 — 등록 실패 카드 (돌아가서 다시 시도)
function showStep3Error(message) {
  $("step3Title").textContent = "❌ 등록하지 못했어요";
  $("step3Title").style.color = "#fecaca";
  $("step3Body").innerHTML =
    '<div class="error">' + escapeHtml(message) + '</div>' +
    '<button id="step3RetryButton" type="button" class="primary step3-new-btn">◀ 돌아가서 다시 시도</button>';
  const retryBtn = $("step3RetryButton");
  if (retryBtn) {
    retryBtn.addEventListener("click", backToStep2FromStep3);
  }
  window.scrollTo(0, 0);
}

async function confirmLedger() {

  if (isSending) return;

  // ⭐ 화면에는 "6,000" 처럼 보여주지만, 서버로는 6000 숫자를 보냅니다.
  const amount = parseAmountInput($("amountInput").value);
  const content = $("contentInput").value.trim();
  const dateValue = $("dateInput").value || todayString();
  const spendingType = $("spendingTypeSelect").value;
  const monthlyId = $("monthlySelect").value;
  const categoryId = $("categorySelect").value;

  // ⭐ Ver 3.0 : 입력값 검증 메시지는 STEP 2 하단에 잠깐 보였다가 자동으로 사라집니다.
  //    (실제 등록 상태는 STEP 3 팝업 카드에서 보여줍니다)
  if (!amount || amount <= 0) {
    flashStep2Status("금액을 입력해주세요.");
    return;
  }
  if (!content) {
    flashStep2Status("수입 / 지출 내용을 입력해주세요.");
    return;
  }
  if (!monthlyId) {
    flashStep2Status("월별가계부를 선택해주세요.");
    return;
  }
  if (!categoryId) {
    flashStep2Status("소분류를 선택해주세요.");
    return;
  }

  isSending = true;
  $("confirmButton").disabled = true;

  // ⭐ STEP 3 진입 : 등록 진행 상태를 팝업 카드로 표시
  showStep3Loading();

  try {

    const data = await postToGAS({
      action: "confirm",
      category: currentKind,
      amount: amount,               // ⭐ 콤마 없는 순수 숫자
      content: content,
      date: dateValue,
      spendingType: spendingType,
      monthlyId: monthlyId,
      categoryId: categoryId
    });

    if (data.status !== "success") {
      throw new Error(data.message || "등록에 실패했습니다.");
    }

    // ⭐ STEP 3 : 등록 완료 카드 (노션 연동 값 + 노션 페이지 바로가기 + 새 기록 버튼)
    showStep3Success({
      kind: currentKind,
      content: data.content || content,
      amount: data.amount || amount,
      date: data.date || dateValue,
      spendingType: spendingType,
      monthlyName: data.monthlyName || "",
      categoryName: data.categoryName || "",
      notionUrl: data.notionUrl || ""
    });

    // 다음 기록을 위해 STEP 2 입력값 초기화
    resetStep2Inputs();

  } catch (error) {

    // ⭐ STEP 3 : 등록 실패 카드 (돌아가서 다시 시도)
    showStep3Error(error.message || String(error));

  } finally {

    isSending = false;
    $("confirmButton").disabled = false;

  }

}

// STEP 1 : 수입 / 지출 선택
